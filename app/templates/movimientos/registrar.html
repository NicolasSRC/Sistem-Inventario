{% extends "base.html" %}
{% block title %}Registrar movimiento{% endblock %}
{% block content %}
<h3 class="page-title mb-3">Registrar movimiento de stock</h3>
<form method="post" class="card shadow-sm card-body row g-3 mx-0">
 <div class="col-md-6"><label class="form-label">Producto *</label><select name="producto_id" class="form-select" required><option value="">Seleccione…</option>
  {% for p in productos %}<option value="{{ p.id }}">{{ p.nombre }} (stock: {{ p.cantidad }})</option>{% endfor %}</select></div>
 <div class="col-md-3"><label class="form-label">Tipo *</label><select name="tipo" class="form-select"><option value="entrada">Entrada</option><option value="salida">Salida</option></select></div>
 <div class="col-md-3"><label class="form-label">Cantidad *</label><input type="number" min="1" name="cantidad" class="form-control" required></div>
 <div class="col-12"><label class="form-label">Observación</label><textarea name="observacion" class="form-control" rows="2"></textarea></div>
 <div class="col-12"><button class="btn btn-primary">Registrar</button> <a class="btn btn-link" href="{{ url_for('movimientos.historial') }}">Ver historial</a></div>
</form>
{% endblock %}
