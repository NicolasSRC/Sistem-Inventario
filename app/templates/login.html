{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block login %}
<div class="login-brand"><i class="bi bi-box-seam"></i><h4 class="mt-2 mb-0">Sistema de Inventarios</h4><small class="opacity-75">Ingrese con su cuenta</small></div>
<div class="card shadow"><div class="card-body p-4">
 <form method="post">
  <div class="mb-3"><label class="form-label">Usuario</label>
   <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span><input name="username" class="form-control" required autofocus></div></div>
  <div class="mb-4"><label class="form-label">Contraseña</label>
   <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" name="password" class="form-control" required></div></div>
  <button class="btn btn-primary w-100">Ingresar</button>
 </form>
</div></div>
{% endblock %}
