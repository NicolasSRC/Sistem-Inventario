{% extends "base.html" %}
{% block title %}{{ 'Editar' if p else 'Nuevo' }} producto{% endblock %}
{% block content %}
<h3 class="page-title mb-3">{{ 'Editar' if p else 'Registrar' }} producto</h3>
<form method="post" class="card shadow-sm card-body row g-3 mx-0">
 <div class="col-md-8"><label class="form-label">Nombre *</label><input name="nombre" class="form-control" maxlength="100" required value="{{ request.form.nombre or (p.nombre if p) or '' }}"></div>
 <div class="col-md-4"><label class="form-label">SKU</label><input name="sku" class="form-control" maxlength="50" value="{{ request.form.sku or (p.sku if p) or '' }}"></div>
 <div class="col-12"><label class="form-label">Descripción</label><textarea name="descripcion" class="form-control" rows="2">{{ request.form.descripcion or (p.descripcion if p) or '' }}</textarea></div>
 <div class="col-md-3"><label class="form-label">Precio *</label><input type="number" step="0.01" min="0" name="precio" class="form-control" required value="{{ request.form.precio or (p.precio if p) or '' }}"></div>
 <div class="col-md-3"><label class="form-label">Cantidad</label><input type="number" min="0" name="cantidad" class="form-control" value="{{ request.form.cantidad or (p.cantidad if p else 0) }}"></div>
 <div class="col-md-3"><label class="form-label">Stock mínimo</label><input type="number" min="0" name="stock_minimo" class="form-control" value="{{ request.form.stock_minimo or (p.stock_minimo if p else 5) }}"></div>
 <div class="col-md-3"><label class="form-label">Categoría</label><select name="categoria_id" class="form-select"><option value="">— Sin categoría —</option>
  {% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if p and p.categoria_id==c.id }}>{{ c.nombre }}</option>{% endfor %}</select></div>
 <div class="col-12"><button class="btn btn-primary">Guardar</button> <a class="btn btn-link" href="{{ url_for('productos.lista') }}">Cancelar</a></div>
</form>
{% endblock %}
