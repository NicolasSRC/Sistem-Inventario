{% extends "base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
 <div>
  <h3 class="page-title">Categorías</h3>
  <p class="page-sub mb-0">Organice los productos por grupos para facilitar la búsqueda</p>
 </div>
</div>

<form method="post" class="form-card mb-4">
 <div class="form-card-body py-3">
  <div class="row g-2 align-items-end">
   <div class="col-md-8">
    <label class="form-label">Nueva categoría</label>
    <div class="input-group">
     <span class="input-group-text"><i class="bi bi-tag"></i></span>
     <input name="nombre" class="form-control" placeholder="Ej. Bebidas, Aseo, Snacks…" maxlength="50" required>
    </div>
   </div>
   <div class="col-md-4">
    <button class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Agregar categoría</button>
   </div>
  </div>
 </div>
</form>

<div class="table-responsive card shadow-sm"><table class="table align-middle mb-0"><thead><tr><th>Nombre</th><th>Productos</th><th></th></tr></thead><tbody>
{% for c in categorias %}<tr><td>
 <form method="post" action="{{ url_for('categorias.editar', id=c.id) }}" class="d-flex gap-2"><input name="nombre" value="{{ c.nombre }}" class="form-control form-control-sm" maxlength="50"><button class="btn btn-sm btn-outline-secondary">Guardar</button></form></td>
 <td>{{ c.productos|length }}</td>
 <td class="text-end"><form method="post" action="{{ url_for('categorias.eliminar', id=c.id) }}" data-confirm="¿Eliminar la categoría?"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr>
{% else %}<tr><td colspan="3" class="text-center text-muted py-4">Sin categorías.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
